<style>

    padding:12px 14px 10px; border-radius:20px; background:rgba(14,16,22,.62); backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3);

  .btn { flex:none; height:32px; padding:0 12px; border-radius:16px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--fg); font:600 12.5px "Noto Sans TC",sans-serif; cursor:pointer; white-space:nowrap; }

  #loader { position:fixed; inset:0; display:grid; place-items:center; background:#050608; z-index:10; transition:opacity .8s; }

  @media (max-width:640px) { #bar { bottom:8px; padding:10px; } .btn { padding:0 9px; font-size:11.5px; } #time { display:none; } }

<script type="module">
import * as THREE from 'three';

/* =========================================================
   CORE UTILITIES
   ========================================================= */
const TAU = Math.PI * 2;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sstep = (a, b, x) => { const t = seg(x, a, b); return t * t * (3 - 2 * t); };
const E = {
  lin: t => t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  io2: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,

function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(i, j) { const h = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y) {

function vnoiseP(x, y, P) {

    const x = p.getX(i) + off.x, y = p.getY(i) + off.y, z = p.getZ(i) + off.z;
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    if (ax >= ay && ax >= az) uv.setXY(i, z / scale, y / scale);

const FONT = '"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif';
const MONO = '"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace';

/* =========================================================
   PROCEDURAL TEXTURES
   ========================================================= */
const TX = {};
function buildTextures() {

  TX.plaster = tex(pixelCanvas(256, 256, (u, v, o) => {
    const n = fbmP(u, v, 6, 5), s = hash2(u * 977, v * 613);
    const k = .93 + n * .09 + (s > .985 ? -.05 : 0);
    o[0] = 240 * k; o[1] = 233 * k; o[2] = 222 * k;
  }));
  // carpet (room)
  TX.carpet = tex(pixelCanvas(256, 256, (u, v, o) => {
    const n = fbmP(u, v, 64, 2), m = fbmP(u, v, 4, 3), s = hash2(u * 1931, v * 1733);
    const k = .78 + n * .3 + m * .12 + s * .06;
    o[0] = 86 * k; o[1] = 92 * k; o[2] = 104 * k;
  }));
  // corridor vinyl planks
  TX.planks = tex(pixelCanvas(512, 512, (u, v, o) => {
    const pw = 1 / 5, pi = Math.floor(u / pw), pu = (u - pi * pw) / pw;
    const offs = hash2(pi, 7) * .7, pv = (v + offs) % 1, pl = Math.floor(pv * 2);
    const tone = .82 + hash2(pi, pl) * .22;
    const grain = Math.sin((pu * 3 + fbm(pu * 2 + pi * 9, pv * 12, 3) * 3) * TAU * 2) * .5 + .5;
    let k = tone * (.88 + grain * .12 + fbm(pu * 40, pv * 4, 2) * .06);
    if (pu < .012 || pu > .988 || Math.abs((pv * 2) % 1) < .006) k *= .55;
    o[0] = 176 * k; o[1] = 140 * k; o[2] = 104 * k;
  }));
  // counter area floor (darker oak)
  TX.oak = tex(pixelCanvas(512, 512, (u, v, o) => {
    const pw = 1 / 4, pi = Math.floor(u / pw), pu = (u - pi * pw) / pw;
    const offs = hash2(pi, 3), pv = (v + offs) % 1;
    const tone = .8 + hash2(pi, Math.floor(pv * 1.5)) * .25;
    const grain = Math.sin((pu * 4 + fbm(pu * 3 + pi, pv * 10, 3) * 4) * TAU) * .5 + .5;
    let k = tone * (.85 + grain * .15);
    if (pu < .01 || pu > .99) k *= .5;

  }));
  const wood = (c1, c2, rings, seed) => pixelCanvas(1024, 256, (u, v, o) => {
    const w = fbm(u * 2.5 + seed, v * 3, 4) * 2.6;
    const s = Math.sin((v * rings + w) * Math.PI) * .5 + .5; const g = Math.pow(s, 2.2);
    const f = fbm(u * 60 + seed, v * 300, 2) * .12;

  });

  TX.walnut = tex(wood([128, 86, 56], [104, 68, 44], 34, 9)); TX.walnut.center.set(.5, .5); TX.walnut.rotation = Math.PI / 2;
  // acoustic ceiling tile (1 tile per texture)
  TX.ceiling = tex(pixelCanvas(256, 256, (u, v, o, i, j) => {
    let k = .95 + fbmP(u, v, 16, 3) * .05;
    if (hash2(i * 3.1, j * 7.7) > .992) k *= .78;
    if (u < .012 || v < .012) k *= .72;
    o[0] = 238 * k; o[1] = 236 * k; o[2] = 230 * k;
  }));
  // exterior view through window
  {
    const [c, x] = mkCanvas(1024, 640);
    const g = x.createLinearGradient(0, 0, 0, 640);
    g.addColorStop(0, '#a9c9e3'); g.addColorStop(.45, '#d8e2e4'); g.addColorStop(.7, '#f6e2bf'); g.addColorStop(1, '#e9cfa3');
    x.fillStyle = g; x.fillRect(0, 0, 1024, 640);
    const sun = x.createRadialGradient(170, 140, 10, 170, 140, 420);
    sun.addColorStop(0, 'rgba(255,240,200,.95)'); sun.addColorStop(1, 'rgba(255,230,190,0)');
    x.fillStyle = sun; x.fillRect(0, 0, 1024, 640);
    x.filter = 'blur(5px)';
    // distant building
    x.fillStyle = '#d7c3a6'; x.fillRect(560, 230, 470, 330);
    x.fillStyle = '#c8b293'; x.fillRect(560, 230, 470, 18);
    for (let r = 0; r < 5; r++) for (let q = 0; q < 8; q++) { x.fillStyle = (r + q) % 3 ? '#8fa3b0' : '#a8b9c2'; x.fillRect(585 + q * 55, 270 + r * 56, 34, 36); }
    const R = rng(4);
    for (let i = 0; i < 260; i++) {
      const tx = R() * 1024, ty = 330 + R() * 330 - (tx < 520 ? 90 * R() : 0), r = 18 + R() * 48;

  }
  // laptop screen (a document / reader app, no names)
  {
    const [c, x] = mkCanvas(512, 340);
    x.fillStyle = '#f4f2ee'; x.fillRect(0, 0, 512, 340);
    x.fillStyle = '#e3e0da'; x.fillRect(0, 0, 512, 22);
    ['#ff5f57', '#febc2e', '#28c840'].forEach((cc, i) => { x.fillStyle = cc; x.beginPath(); x.arc(14 + i * 14, 11, 4, 0, TAU); x.fill(); });
    x.fillStyle = '#ffffff'; x.fillRect(110, 34, 292, 300);
    x.fillStyle = '#2b2b2b'; x.fillRect(130, 54, 160, 9);
    const R = rng(11); x.fillStyle = '#9a9a9a';
    for (let y = 78; y < 320; y += 11) { const w = 200 + R() * 52; if (R() > .9) { y += 6; continue; } x.fillRect(130, y, w, 4); }
    x.fillStyle = '#c7d7ea'; x.fillRect(130, 190, 120, 70);

  }
  // book page
  {
    const [c, x] = mkCanvas(256, 360);
    x.fillStyle = '#f5efe1'; x.fillRect(0, 0, 256, 360);
    const R = rng(5); x.fillStyle = 'rgba(60,55,50,.55)';
    for (let y = 30; y < 330; y += 9) x.fillRect(22, y, 190 + R() * 25, 3);
    TX.page = tex(c);
  }
  // abstract print for wall
  {
    const [c, x] = mkCanvas(256, 360);
    x.fillStyle = '#efe6d6'; x.fillRect(0, 0, 256, 360);
    x.fillStyle = '#c86f45'; x.beginPath(); x.arc(150, 130, 70, 0, TAU); x.fill();
    x.fillStyle = '#2f5d62'; x.fillRect(30, 190, 150, 120);
    x.fillStyle = '#e2b65b'; x.fillRect(120, 230, 100, 90);
    x.strokeStyle = '#3a2e28'; x.lineWidth = 3; x.beginPath(); x.moveTo(30, 70); x.bezierCurveTo(90, 20, 160, 260, 230, 200); x.stroke();

/* thermal palette (matches the web dashboard look: deep purple → magenta → orange → yellow) */
const PAL_STOPS = [[0, [8, 2, 26]], [.14, [44, 8, 92]], [.3, [78, 12, 128]], [.44, [112, 20, 138]], [.58, [176, 42, 112]], [.72, [232, 92, 40]], [.86, [250, 160, 22]], [1, [255, 236, 110]]];

(function () {
  for (let i = 0; i < 256; i++) {
    const v = i / 255; let k = 0; while (k < PAL_STOPS.length - 2 && v > PAL_STOPS[k + 1][0]) k++;

/* =========================================================

   ========================================================= */
const MAT = {};

function buildMaterials() {

  MAT.oak = std({ map: TX.oak, roughness: .5, envMapIntensity: .5 });
  MAT.ceiling = std({ map: TX.ceiling, roughness: .95 });
  MAT.desk = std({ map: TX.oakDesk, roughness: .48, envMapIntensity: .55 });
  MAT.walnut = std({ map: TX.walnut, roughness: .5, envMapIntensity: .5 });
  MAT.trim = std({ color: 0xf0ebe2, roughness: .45 });
  MAT.trimDark = std({ color: 0x4a3a2e, roughness: .6 });
  MAT.alu = std({ color: 0xc9ccd0, metalness: 1, roughness: .32, envMapIntensity: 1 });
  MAT.steel = std({ color: 0xdadde0, metalness: 1, roughness: .22, envMapIntensity: 1.1 });
  MAT.chrome = std({ color: 0xffffff, metalness: 1, roughness: .12, envMapIntensity: 1.2 });
  MAT.darkMetal = std({ color: 0x2b2d31, metalness: .8, roughness: .45, envMapIntensity: .8 });
  MAT.black = std({ color: 0x17181a, roughness: .5 });
  MAT.blackGloss = std({ color: 0x0c0c0e, roughness: .2, envMapIntensity: .9 });
  MAT.fabric = std({ color: 0x3e4655, roughness: .95 });
  MAT.white = std({ color: 0xf6f4ef, roughness: .5 });
  MAT.ceramic = std({ color: 0xf4f1ea, roughness: .25, envMapIntensity: .8 });
  MAT.terracotta = std({ color: 0xb8613d, roughness: .85 });
  MAT.leaf = std({ color: 0x4f7a3a, roughness: .65, side: THREE.DoubleSide });
  MAT.glass = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .03, metalness: 0, transparent: true, opacity: .1, envMapIntensity: 1.2, depthWrite: false });
  MAT.exterior = new THREE.MeshBasicMaterial({ map: TX.exterior, color: new THREE.Color(1.55, 1.48, 1.38), toneMapped: true });
  MAT.laptopScreen = new THREE.MeshBasicMaterial({ map: TX.laptop, color: new THREE.Color(.8, .8, .82) });
  MAT.page = std({ map: TX.page, roughness: .9 });
  MAT.print = std({ map: TX.print, roughness: .85 });
  MAT.paper = std({ color: 0xf2efe6, roughness: .9 });

    const toDetail = sstep(57.75, 58.15, t);
    if (toDetail < 1) { S.hover = c && c.x < 340 && c.y > 309 && c.y < 737 ? 0 : -1; drawDashboard(x, S); }
    if (toDetail > 0) { x.save(); x.globalAlpha = toDetail; x.translate(0, (1 - toDetail) * 14); drawDetail(x, S, null); x.restore(); }
    if (c) drawCursor(x, c.x, c.y, c.click);
    return true;
  }
  if (t >= 63.4) {
    const S = roomsAt(t); const F = formAt(t); drawDetail(x, S, F);
    toast(x, sstep(68.4, 68.7, t) * (1 - sstep(69.6, 69.95, t)), '巡查紀錄已送出');
    const c = cursorAt(t); if (c) drawCursor(x, c.x, c.y, c.click);
    return true;
  }
  const S = roomsAt(t); drawDashboard(x, S); return true;
}

/* ---------- data HUD (telemetry) ---------- */
function drawDataHUD(x, t) {
  const L = t - 17.05; if (L < 0 || L > 11.6) return;
  const a = sstep(0, .6, L) * (1 - sstep(10.4, 11.3, L));
  x.save(); x.globalAlpha = a; x.font = `500 15px ${MONO}`; x.textBaseline = 'alphabetic';
  const lines = [];
  lines.push([.3, 'UART  /dev/ttyACM0 · 115200 baud', '#9fb0c3']);
  if (L < 2.45) lines.push([.4, `FRAME 000411   CRC ${L > 1.35 ? '✕  DROPPED' : '…'}`, L > 1.35 ? '#f87171' : '#9fb0c3']);
  else lines.push([2.45, `FRAME 000412   CRC ✓`, '#34d399']);
  lines.push([3.9, 'INTERP   32×24  →  256×192   bicubic', '#d1d5db']);
  lines.push([5.6, 'BG MODEL α=0.02   SUBTRACT', '#d1d5db']);
  lines.push([7.0, 'THRESHOLD   30.5 °C', '#5eead4']);
  lines.push([8.4, 'BLOB  1   CONF  ' + [0, 1, 2].map(i => L > 8.75 + i * .38 ? '■' : '□').join(' '), '#34d399']);
  lines.push([9.95, 'COUNT  1   →  UPLOAD', '#f9fafb']);
  let y = 1080 - 60 - (lines.length - 1) * 26;
  for (const [s, txt, c] of lines) { const k = sstep(s, s + .25, L); if (k <= 0) { y += 26; continue; } x.globalAlpha = a * k; x.fillStyle = c; x.fillText(txt, 64 + (1 - k) * -10, y); y += 26; }
  // top-right frame counter + sensor scale
  x.globalAlpha = a * .9; x.fillStyle = '#9fb0c3'; x.textAlign = 'right'; x.fillText(`MLX90640 · 32×24 · 4 Hz`, 1856, 74);
  const g = x.createLinearGradient(1700, 0, 1856, 0); for (let i = 0; i <= 8; i++) g.addColorStop(i / 8, palCss(i / 8)); x.fillStyle = g; x.fillRect(1700, 90, 156, 6);
  x.fillStyle = '#9fb0c3'; x.font = `500 12px ${MONO}`; x.fillText('36°', 1856, 114); x.textAlign = 'left'; x.fillText('20°', 1700, 114);
  x.restore();
}
function drawPiP(x, t) {
  const a = sstep(43.7, 44.3, t) * (1 - sstep(54.6, 55.2, t)); if (a <= 0) return;
  const S = roomsAt(t); const s = .9, X = 1920 - 291 * s - 52, Y = 1080 - 428 * s - 56;
  x.save(); x.globalAlpha = a;
  x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 50; x.shadowOffsetY = 18; rr(x, X, Y, 291 * s, 428 * s, 26 * s); x.fillStyle = '#0d1016'; x.fill(); x.shadowColor = 'transparent';
  x.translate(X, Y); x.scale(s, s); roomCard(x, 0, 0, S.rooms[0], { pulse: S.pulse }); x.restore();
  // story clock chip
  x.save(); x.globalAlpha = a; const ff = t > 50 && t < 54; x.font = `600 17px ${MONO}`; const txt = S.clock; const w = x.measureText(txt).width + (ff ? 70 : 44);
  rr(x, 1920 - 52 - w, Y - 54, w, 38, 19); x.fillStyle = 'rgba(10,12,18,.72)'; x.fill(); x.strokeStyle = 'rgba(255,255,255,.12)'; x.stroke();
  x.fillStyle = ff ? '#fbbf24' : '#f87171'; if (ff) { x.beginPath(); x.moveTo(1920 - 52 - w + 16, Y - 44); x.lineTo(1920 - 52 - w + 26, Y - 35); x.lineTo(1920 - 52 - w + 16, Y - 26); x.fill(); x.beginPath(); x.moveTo(1920 - 52 - w + 27, Y - 44); x.lineTo(1920 - 52 - w + 37, Y - 35); x.lineTo(1920 - 52 - w + 27, Y - 26); x.fill(); }
  else { x.beginPath(); x.arc(1920 - 52 - w + 22, Y - 35, 5 + Math.sin(t * 5) * .8, 0, TAU); x.fill(); }
  x.fillStyle = '#f3f4f6'; x.fillText(txt, 1920 - 52 - w + (ff ? 48 : 34), Y - 29); x.restore();
}
function blackAt(t) {
  return Math.max(1 - sstep(0, 1.4, t), sstep(16.78, 17.05, t) * (1 - sstep(17.05, 17.7, t)), sstep(42.4, 43.0, t) * (1 - sstep(43.0, 43.7, t)), sstep(73.6, 75, t));
}

/* ---------- renderer setup ---------- */
let renderer, composer, renderPass, bloom, bokeh, fxPass, camera, world;
const stage = { w: 1280, h: 720, pr: 1 };
function initRenderer(canvas) {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .82;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  RectAreaLightUniformsLib.init();
  world = new THREE.Scene(); world.background = new THREE.Color(0x0b0b0d);
  const pm = new THREE.PMREMGenerator(renderer); world.environment = pm.fromScene(new RoomEnvironment(renderer), .04).texture;
  camera = new THREE.PerspectiveCamera(36, 16 / 9, .01, 40);
  const rt = new THREE.WebGLRenderTarget(1280, 720, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  renderPass = new RenderPass(world, camera); composer.addPass(renderPass);
  bokeh = new BokehPass(world, camera, { focus: 1, aperture: .002, maxblur: .012 }); composer.addPass(bokeh);
  bloom = new UnrealBloomPass(new THREE.Vector2(640, 360), .45, .55, .9); composer.addPass(bloom);
  composer.addPass(new OutputPass());
  fxPass = new ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVig: { value: .9 }, uGrain: { value: .03 }, uCA: { value: .0025 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime,uVig,uGrain,uCA; varying vec2 vUv;
      float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      void main(){ vec2 d=vUv-.5; float r=dot(d,d);
        vec3 c; c.r=texture2D(tDiffuse, vUv - d*uCA*r*8.0).r; c.g=texture2D(tDiffuse, vUv).g; c.b=texture2D(tDiffuse, vUv + d*uCA*r*8.0).b;
        c *= mix(1.0, smoothstep(.95, .18, r*1.55), uVig);
        c += (h(vUv*vec2(1733.0,977.0)+fract(uTime*7.31))-.5)*uGrain;
        gl_FragColor=vec4(c,1.0); }`,
  });
  composer.addPass(fxPass);
}
function setStageSize(w, h, pr) {
  stage.w = w; stage.h = h; stage.pr = pr;
  renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
  composer.setPixelRatio(pr); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const ui = document.getElementById('ui'); ui.width = Math.round(w * pr); ui.height = Math.round(h * pr);
  PAGE.width = ui.width; PAGE.height = ui.height;
}
const PAGE = document.createElement('canvas');
const SCREEN = (() => { const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; return c; })();
let screenTex;

/* ---------- apply full scene state for time t ---------- */
function applyState(t) {
  const s = cameraUpdate(t, camera);
  const loc = s.loc; const A = a2d(t);
  W.room.visible = loc === 'room'; W.counter.visible = loc === 'counter'; W.sun.visible = loc === 'room';
  studentUpdate(t); workerUpdate(t);
  W.worker.visible = loc === 'counter' || (loc === 'room' && t > 59);
  W.door.rotation.y = doorAngle(t);
  W.clock.set(storySec(t));
  // timelapse light drift
  const tl = sstep(50, 54, t) * (1 - sstep(55, 56, t));
  W.sun.intensity = lerp(1.55, 1.3, tl); W.sun.color.setRGB(1, lerp(.86, .74, tl), lerp(.68, .5, tl));
  W.sun.position.set(lerp(-2.2, -3.0, tl), lerp(4.4, 3.2, tl), -5.5);
  MAT.exterior.color.setRGB(lerp(1.55, 1.5, tl), lerp(1.48, 1.32, tl), lerp(1.38, 1.05, tl));
  // device LEDs
  const fr = Math.floor(t * 4), ph = t * 4 - fr;
  DEV.uTX.visible = ph < .22; DEV.uRX.visible = ph > .5 && ph < .62; DEV.uL.visible = (Math.floor(t * 1.5) % 2) === 0;
  DEV.piAct.visible = hash2(Math.floor(t * 9), 3) > .45; DEV.ethLedA.visible = hash2(Math.floor(t * 11), 7) > .5;
  // data scene
  if (loc === 'data') updateData(t - 17.05, t);
  // render target choice
  renderPass.scene = loc === 'data' ? D.scene : world; bokeh.scene = renderPass.scene;
  const dofOn = (loc === 'room' || loc === 'counter') && s.ap; bokeh.enabled = !!dofOn;
  if (dofOn) { bokeh.uniforms.focus.value = s._focus; bokeh.uniforms.aperture.value = s.ap; bokeh.uniforms.maxblur.value = s.dev ? .016 : .009; bokeh.uniforms.nearClip.value = camera.near; bokeh.uniforms.farClip.value = camera.far; bokeh.uniforms.aspect.value = camera.aspect; }
  bloom.strength = loc === 'data' ? .85 : .42; bloom.threshold = loc === 'data' ? .55 : 1.0; bloom.radius = loc === 'data' ? .6 : .5;
  fxPass.uniforms.uTime.value = t; fxPass.uniforms.uVig.value = loc === 'data' ? 1.0 : .85;
  // monitor content
  if (loc === 'counter') {
    const x = SCREEN.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0);
    if (t < 50) drawDashboard(x, roomsAt(t)); else { const S = roomsAt(t); drawDetail(x, S, formAt(t)); }
    screenTex.needsUpdate = true;
  }
  return { loc, A };
}
function renderFrame(t) {
  const { loc, A } = applyState(t);
  const gl = loc !== 'none' && A < 1;
  if (gl) composer.render(); else { renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 1); renderer.clear(); }
  const ui = document.getElementById('ui'), x = ui.getContext('2d');
  const sx = ui.width / 1920, sy = ui.height / 1080;
  x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, ui.width, ui.height);
  if (A > 0) {
    const p = PAGE.getContext('2d'); p.setTransform(sx, 0, 0, sy, 0, 0); drawPage(p, t);
    x.globalAlpha = A; x.drawImage(PAGE, 0, 0); x.globalAlpha = 1;
  }
  x.setTransform(sx, 0, 0, sy, 0, 0);
  if (loc === 'data') drawDataHUD(x, t);
  drawPiP(x, t);
  const b = blackAt(t); if (b > 0) { x.fillStyle = `rgba(0,0,0,${b})`; x.fillRect(0, 0, 1920, 1080); }
  return gl;
}

/* ---------- boot ---------- */
async function boot() {
  const status = document.getElementById('loadmsg');
  const step = async (m) => { status.textContent = m; await new Promise(r => setTimeout(r, 16)); };
  try { await Promise.race([Promise.all([document.fonts.load(`700 20px "Noto Sans TC"`), document.fonts.load(`800 20px "Noto Sans TC"`), document.fonts.load(`500 20px "Noto Sans TC"`), document.fonts.load(`600 16px "JetBrains Mono"`)]), new Promise(r => setTimeout(r, 4000))]); } catch (e) { }
  await step('建立材質…'); buildTextures(); buildMaterials();
  initRenderer(document.getElementById('gl'));
  await step('建立研究小間…');
  buildRoom(world); buildFurniture(W.room); buildCounter(world);
  const sun = new THREE.DirectionalLight(0xffdcaa, 2.6); sun.position.set(-2.2, 4.4, -5.5); sun.target.position.set(0, .6, -.2);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); const sc = sun.shadow.camera; sc.left = -2.2; sc.right = 2.2; sc.top = 2.4; sc.bottom = -2.4; sc.near = 2; sc.far = 12; sun.shadow.bias = -.0004; sun.shadow.normalBias = .02;
  world.add(sun, sun.target); W.sun = sun;
  world.add(new THREE.HemisphereLight(0xfff1e0, 0x3a3026, .25));
  screenTex = new THREE.CanvasTexture(SCREEN); screenTex.colorSpace = THREE.SRGBColorSpace; screenTex.anisotropy = 8; W.screen.material.map = screenTex; W.screen.material.needsUpdate = true;
  await step('建立人物…');
  W.student = makeHuman({ shirt: 0xb4673f, pants: 0x2d3a4f, hairStyle: 'long', skin: 0xdcae8f }); W.room.add(W.student);
  W.worker = makeHuman({ shirt: 0x26324a, pants: 0x8c7a5c, hairStyle: 'short', skin: 0xcf9f7c, lanyard: true, cardigan: true }); world.add(W.worker);
  WALK = new THREE.CatmullRomCurve3([V3(.12, 0, -.32), V3(.42, 0, -.06), V3(.43, 0, .6), V3(.4, 0, 1.25), V3(.4, 0, 2.2)], false, 'centripetal'); WALK_LEN = WALK.getLength();
  await step('建立邊緣裝置…');
  const dev = buildDevice(); W.room.add(dev);
  dev.position.set(-ROOM.X + .125, 2.355, ROOM.Z - .125); dev.lookAt(.05, 1.3, -.8); dev.updateMatrixWorld(true);
  buildDeviceCables(W.room);
  studentUpdate(0); W.room.updateMatrixWorld(true);
  setupSensorCam();
  await step('建立資料場景…');
  buildDataScene();
  buildShots();
  await step('編譯著色器…');
  layout(); renderFrame(0.01);
  renderer.compile(world, camera); renderer.compile(D.scene, camera);
  document.getElementById('loader').classList.add('done');
  window.__dbg = { FEED, D, TH, W, DEV };
  window.__ready = true;
  startUI();
}
window.addEventListener('error', e => { const m = document.getElementById('loadmsg'); if (m) m.textContent = '錯誤：' + e.message; });

/* =========================================================
   PLAYER UI + EXPORT
   ========================================================= */
const player = { t: 0, playing: true, last: 0, dragging: false };
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = vw, h = vw * 9 / 16; if (h > vh) { h = vh; w = vh * 16 / 9; }
  const st = document.getElementById('stage'); st.style.width = w + 'px'; st.style.height = h + 'px';
  const pr = Math.min(window.devicePixelRatio || 1, 2, 2560 / w);
  setStageSize(Math.round(w), Math.round(h), pr);
}
function fmtClock(t) { const s = Math.floor(t); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function startUI() {
  const bar = document.getElementById('bar'), track = document.getElementById('track'), fill = document.getElementById('fill'), chips = document.getElementById('chips');
  CHAPTERS.forEach((c, i) => {
    const end = i < CHAPTERS.length - 1 ? CHAPTERS[i + 1].t : DUR;
    const m = document.createElement('div'); m.className = 'tick'; m.style.left = (c.t / DUR * 100) + '%'; track.appendChild(m);
    const b = document.createElement('button'); b.className = 'chip'; b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span>${c.n}`;
    b.onclick = () => { player.t = c.t + .001; frame(true); }; chips.appendChild(b); c.el = b; c.end = end;
  });
  const playBtn = document.getElementById('play');
  const setPlay = p => { player.playing = p; playBtn.classList.toggle('paused', !p); if (p && player.t >= DUR - .01) player.t = 0; };
  playBtn.onclick = () => setPlay(!player.playing);
  const seekFromEvent = e => { const r = track.getBoundingClientRect(); player.t = clamp((e.clientX - r.left) / r.width) * DUR; frame(true); };
  track.addEventListener('pointerdown', e => { player.dragging = true; track.setPointerCapture(e.pointerId); seekFromEvent(e); });
  track.addEventListener('pointermove', e => { if (player.dragging) seekFromEvent(e); });
  track.addEventListener('pointerup', () => player.dragging = false);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setPlay(!player.playing); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
      const i = CHAPTERS.findIndex((c, k) => player.t >= c.t && (k === CHAPTERS.length - 1 || player.t < CHAPTERS[k + 1].t));
      const j = clamp(i + (e.code === 'ArrowRight' ? 1 : (player.t - CHAPTERS[i].t > 1.5 ? 0 : -1)), 0, CHAPTERS.length - 1);
      player.t = CHAPTERS[j].t + .001; frame(true);
    }
  });
  document.getElementById('shot').onclick = () => exportStills([[player.t, `demo_${fmtClock(player.t).replace(':', 'm')}s`]]);
  document.getElementById('shots').onclick = () => exportStills(STILLS);
  // auto-hide
  let idle = 0; const wake = () => { bar.classList.remove('hide'); document.body.style.cursor = ''; clearTimeout(idle); idle = setTimeout(() => { if (player.playing) { bar.classList.add('hide'); document.body.style.cursor = 'none'; } }, 2600); };
  window.addEventListener('pointermove', wake); wake();
  window.addEventListener('resize', () => { layout(); frame(true); });
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { player.t = parseFloat(q.get('t')); setPlay(false); frame(true); }
  window.__seek = t => { player.t = t; setPlay(false); frame(true); };
  player.last = performance.now(); requestAnimationFrame(loop);
  function loop(now) {
    const dt = Math.min(.1, (now - player.last) / 1000); player.last = now;
    if (player.playing && !player.busy) { player.t += dt; if (player.t >= DUR) { player.t = DUR; setPlay(false); } frame(false); }
    requestAnimationFrame(loop);
  }
  function frame() {
    if (player.busy) return;
    renderFrame(player.t);
    fill.style.width = (player.t / DUR * 100) + '%';
    document.getElementById('time').textContent = `${fmtClock(player.t)} / ${fmtClock(DUR)}`;
    CHAPTERS.forEach(c => c.el.classList.toggle('on', player.t >= c.t && player.t < c.end));
  }
  window.__frame = frame;
}
async function exportStills(list) {
  if (player.busy) return; player.busy = true;
  const wasPlaying = player.playing; player.playing = false; document.getElementById('play').classList.add('paused');
  const note = document.getElementById('note'); note.classList.add('on');
  const prev = { w: stage.w, h: stage.h, pr: stage.pr };
  const EW = 2560, EH = 1440;
  try {
    setStageSize(EW, EH, 1);
    for (let i = 0; i < list.length; i++) {
      const [t, name] = list[i]; note.textContent = `匯出中 ${i + 1} / ${list.length}`;
      await new Promise(r => setTimeout(r, 30));
      renderFrame(t); renderFrame(t); // second pass settles cached feeds
      const c = document.createElement('canvas'); c.width = EW; c.height = EH; const x = c.getContext('2d');
      x.drawImage(renderer.domElement, 0, 0, EW, EH); x.drawImage(document.getElementById('ui'), 0, 0, EW, EH);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${name}.png`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      await new Promise(r => setTimeout(r, 350));
    }
  } finally {
    setStageSize(prev.w, prev.h, prev.pr); note.classList.remove('on'); player.busy = false; window.__frame(true);
    if (wasPlaying && list.length > 1) { } // stay paused after batch export
  }
}
boot();
